[project]
name = "cpr-checks"
version = "0.1.0"
description = "Executable checks for the determinism and solver-grade-correctness criteria of the Continuous Physics Reasoning framework"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["cprcheck"]
